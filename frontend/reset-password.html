<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Task Management</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #f3f6fb; color: #172033; font-family: Arial, sans-serif; }
        main { width: min(100%, 440px); padding: 34px; border: 1px solid #e1e7f0; border-radius: 16px; background: #fff; box-shadow: 0 18px 50px rgba(28, 44, 75, .09); }
        h1 { margin: 0 0 10px; font-size: 26px; }
        p { color: #657187; line-height: 1.5; }
        label { display: block; margin: 18px 0 7px; font-weight: 600; }
        input { width: 100%; padding: 12px; border: 1px solid #cfd7e3; border-radius: 8px; font: inherit; }
        button { width: 100%; margin-top: 22px; padding: 13px; border: 0; border-radius: 8px; background: #245ce2; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
        button:disabled { opacity: .65; cursor: wait; }
        #message { min-height: 22px; margin: 14px 0 0; }
        a { color: #245ce2; }
    </style>
</head>
<body>
    <main>
        <h1>Set a new password</h1>
        <p>Choose a password with at least 8 characters. Reset links expire after 20 minutes and work once.</p>
        <form id="resetPasswordForm">
            <label for="newPassword">New password</label>
            <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required>
            <label for="confirmPassword">Confirm password</label>
            <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
            <button id="resetButton" type="submit">Reset password</button>
        </form>
        <p id="message" role="status"></p>
        <a href="index.html">Back to login</a>
    </main>
    <script src="reset-password.js"></script>
</body>
</html>
